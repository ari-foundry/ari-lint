name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Zero-argument test mode is intentionally compiler-free. Pinned compiler
      # provisioning lives in the separate compiler-smoke workflow.
      - name: Run lightweight checks
        run: scripts/test.sh
