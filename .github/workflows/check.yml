name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Zero-argument test mode is intentionally compiler-free. Explicit,
      # pinned Ari compiler provisioning remains a separate follow-up.
      - name: Run lightweight checks
        run: scripts/test.sh
