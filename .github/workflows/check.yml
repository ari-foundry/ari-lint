name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Zero-argument test mode is intentionally compiler-free. Pinned compiler
      # provisioning lives in the separate compiler-smoke workflow.
      - name: Run lightweight checks
        run: scripts/test.sh
